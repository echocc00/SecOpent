[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secopent"
dynamic = ["version"]
description = "Catalog-driven Agent-native authorized pentest workbench"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "SecOpent" }]
dependencies = [
    "sqlalchemy>=2.0,<2.1",
    "httpx>=0.27,<1.0",
    "cryptography>=42.0,<44",
    "pyyaml>=6.0,<7",
    "jinja2>=3.1,<4",
    "fastapi>=0.115,<0.116",
    "pydantic>=2.0,<3",
    "defusedxml>=0.7,<1",
    "structlog>=24,<26",
    "prometheus_client>=0.20,<1",
    "opentelemetry-api>=1.25,<2",
    "opentelemetry-sdk>=1.25,<2",
    "opentelemetry-instrumentation-fastapi>=0.46b0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=4",
    "pytest-benchmark>=4",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
]

[tool.setuptools.packages.find]
where = ["src"]

# Version single source of truth (T9): src/secopent/__version__.py.
[tool.setuptools.dynamic]
version = { attr = "secopent.__version__.__version__" }

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# image_catalog.py: sha256 digests are inherently long, cannot be split
"src/secopent/infrastructure/adapters/image_catalog.py" = ["E501"]
# scripts/: utility scripts, long lines acceptable
"scripts/*.py" = ["E501"]

[tool.ruff]
line-length = 100
# Autogenerated alembic migrations don't follow the project style.
extend-exclude = ["alembic/versions"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["secopent.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Real-target E2E and browser tests are opt-in (slow, environment-dependent);
# run them explicitly with `pytest -m e2e_real` / `pytest -m browser` /
# `pytest -m perf`.
addopts = "-m \"not e2e_real and not browser and not perf\""
markers = [
    "integration: requires Docker + real tools (slow)",
    "e2e_real: requires Docker + target ranges (slow)",
    "browser: requires Playwright browser",
    "perf: performance regression benchmarks (opt-in)",
]
