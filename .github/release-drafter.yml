name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
version-resolver:
  major:
    labels: ["breaking", "major"]
  minor:
    labels: ["feat", "feature", "enhancement"]
  patch:
    labels: ["fix", "bugfix", "chore", "docs"]
  default: minor
categories:
  - title: "Breaking Changes"
    labels: ["breaking", "major"]
  - title: "New Features"
    labels: ["feat", "feature", "enhancement"]
  - title: "Bug Fixes"
    labels: ["fix", "bugfix"]
  - title: "Documentation"
    labels: ["docs"]
  - title: "Maintenance"
    labels: ["chore", "refactor", "dependencies"]
  - title: "Other Changes"
    labels: ["*"]
change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
template: |
  ## Changes

  $CHANGES

  ## License

  Apache-2.0
