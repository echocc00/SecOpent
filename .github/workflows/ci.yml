name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Encoding hygiene (no BOM / stray control chars)
        run: |
          ! grep -rlP '\xEF\xBB\xBF' src tests || (echo "BOM found" && exit 1)

  type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: mypy (strict for domain/application)
        run: mypy src/secopent/domain src/secopent/application

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test (coverage gate 70%)
        run: pytest --cov=src --cov-fail-under=70 -q

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile check
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compileall
        run: python -m compileall -q src tests
      # Real docker-compose smoke (Juice Shop/crAPI/httpbin) runs in an
      # environment with Docker; gated here so CI stays green where Docker is
      # unavailable.
      - name: Smoke marker
        run: echo "compose smoke deferred to Docker-enabled environment (M5 E2E)"
