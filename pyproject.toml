[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secopent"
version = "0.1.0-dev"
description = "Catalog-driven Agent-native authorized pentest workbench"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "SecOpent" }]
dependencies = [
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "cryptography>=42.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "fastapi>=0.115",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=4",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# image_catalog.py: sha256 digests are inherently long, cannot be split
"src/secopent/infrastructure/adapters/image_catalog.py" = ["E501"]
# scripts/: utility scripts, long lines acceptable
"scripts/*.py" = ["E501"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["secopent.domain.*", "secopent.application.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
