name: db

# T15 / cross-cutting §④: PostgreSQL backend verification. Applies the alembic
# migrations to a real PostgreSQL 15 service and runs the SQLite -> PG migration
# + ORM round-trip smoke test. (The full test suite still targets SQLite; a
# --db=pg full-suite run is a follow-up that needs the test fixtures refactored
# onto the SECOPTENT_DB_URL engine factory.)

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: secopent
          POSTGRES_PASSWORD: secopent
          POSTGRES_DB: secopent
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECOPTENT_DB_URL: postgresql+psycopg://secopent:secopent@localhost:5432/secopent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Alembic migrations apply on PostgreSQL
        run: alembic upgrade head
      - name: SQLite -> PG migration + ORM round-trip
        run: python scripts/verify_pg.py
