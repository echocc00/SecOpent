name: 💡 Feature Request
description: 提出新功能或改进建议
title: "[Feature]: "
labels: ["enhancement", "triage"]
assignees:
  - echocc00
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议!请描述清楚要解决的问题和你设想的方案。

  - type: textarea
    id: problem
    attributes:
      label: 解决的问题
      description: 你想解决什么问题?目前的工作流哪里让你不爽?
      placeholder: |
        作为 [角色],我想要 [目标],但是目前 [障碍]。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望项目如何改进?
      placeholder: |
        理想情况下,应该有 [功能 / API / UI],让我能 [目标]。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案考虑
      description: 你考虑过哪些替代方案?为什么这个更好?
      placeholder: |
        方案 A: ...(优缺点)
        方案 B: ...(优缺点)
    validations:
      required: false

  - type: textarea
    id: use_case
    attributes:
      label: 使用场景
      description: 这个功能被谁使用?在什么场景下?
      placeholder: |
        谁会用: 中小企业 / 网络工程师 / 安全分析师 / ...
        使用场景: ...
    validations:
      required: false

  - type: checkboxes
    id: contributions
    attributes:
      label: 你愿意贡献吗?
      options:
        - label: 我愿意提交 PR 实现这个功能
        - label: 我可以帮忙写测试 / 文档
        - label: 我只能提建议,无暇贡献代码
        - label: 我愿意资助 / 赞助这个功能

  - type: input
    id: references
    attributes:
      label: 参考链接
      description: 类似功能 / 竞品 / 设计参考(可选)
      placeholder: "https://..."