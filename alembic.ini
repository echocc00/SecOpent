# Alembic configuration (T15 / cross-cutting concern 4: migrations).
# The database URL comes from SECOPTENT_DB_URL (sqlite:/// or postgresql://);
# alembic/env.py reads it, falling back to sqlalchemy.url below.
[alembic]
script_location = alembic
prepend_sys_path = src
sqlalchemy.url = sqlite:///secopent.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
