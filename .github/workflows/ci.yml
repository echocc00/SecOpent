name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  # Manual trigger for real-target E2E (Phase 2.6) on branches/PRs without a
  # release. The e2e_real job is also gated to release events below.
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff (whole repo, matches local gate)
        run: ruff check .
      - name: Forbidden patterns (v3/v4/v5 bug-class guard)
        run: python scripts/lint_forbidden_patterns.py
      - name: Encoding hygiene (no BOM / stray control chars)
        run: |
          ! grep -rlP '\xEF\xBB\xBF' src tests || (echo "BOM found" && exit 1)

  type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # T7: full-package strict mypy (218 files), matching the local gate - not
      # just domain/application.
      - name: mypy (strict, all of src/secopent)
        run: mypy src/secopent

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # T7: coverage gate raised 70% -> 80% (measured ~93%). e2e_real/perf are
      # deselected by default (they need Docker targets / are benchmark-only).
      - name: Test (coverage gate 80%)
        run: pytest --cov=src --cov-report=term --cov-report=xml --cov-fail-under=80 -q
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install + typecheck + build
        working-directory: src/secopent/interfaces/web
        run: |
          npm ci --legacy-peer-deps
          npx tsc -b
          npm run build

  browser-e2e:
    runs-on: ubuntu-latest
    needs: [frontend, test]
    defaults:
      run:
        working-directory: src/secopent/interfaces/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend (uvicorn serves the API for the specs)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install frontend + Playwright Chromium
        run: |
          npm ci --legacy-peer-deps
          npx playwright install --with-deps chromium
      # playwright.config.ts starts uvicorn itself; PYTHON_BIN overrides the
      # interpreter (ubuntu has no Windows `py` launcher).
      - name: Playwright E2E
        env:
          PYTHON_BIN: python
          CI: "true"
        run: npx playwright test

  e2e-real:
    # Phase 2.6: real-target E2E against live Juice Shop + httpbin + self-hosted
    # interactsh. Too slow for the PR path (real tool containers + scan waits),
    # so gated to release events + manual workflow_dispatch. PR CI keeps the
    # auto-skip conftest (tests/e2e_real/conftest.py) as a safety net.
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [test]
    # Real target ranges as sibling service containers; the adapter tool
    # containers reach them via host.docker.internal:host-gateway (added by the
    # SubprocessContainerExecutor, T7).
    services:
      juice_shop:
        image: bkimminich/juice-shop
        ports:
          - 3000:3000
      httpbin:
        image: kennethreitz/httpbin
        ports:
          - 8080:80
    env:
      # OOB callback channel (Phase 2.4): HTTP port of the self-hosted
      # interactsh-server started below. HTTPS (8444) is disabled for the
      # intranet oast.local domain; see docs/deployment/interactsh.md.
      SECOPTENT_INTERACTSH_SERVER_URL: http://127.0.0.1:8081
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # interactsh-server needs -domain oast.local + per-port flags; start it
      # via docker run (the services: block can't pass command args cleanly).
      # Mirrors scripts/provision/docker-compose.interactsh.yml.
      - name: Start interactsh-server (OOB callback channel)
        run: |
          docker run -d --name secopent-interactsh \
            -p 5300:53/udp -p 5300:53/tcp \
            -p 8081:80 -p 8444:443 -p 2525:2525 \
            projectdiscovery/interactsh-server:latest \
            -domain oast.local -listen-ip 0.0.0.0 \
            -dns-port 53 -http-port 80 -https-port 443 -smtp-port 2525
          # Wait for the HTTP callback endpoint to come up (HTTPS is disabled
          # for oast.local; only HTTP / is expected to respond 200).
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8081/ >/dev/null 2>&1; then
              echo "interactsh-server ready"; exit 0
            fi
            sleep 2
          done
          echo "interactsh-server did not become ready"; docker logs secopent-interactsh; exit 1
      # Digest-pinned tool images are pulled on demand by `docker run`.
      # -m "not realism": realism tier (file DB + NullPool + concurrent) is a
      #   separate release-CI concern; keep this job on the e2e_real tier.
      # --maxfail=3: bail early so a flaky target doesn't burn the whole suite.
      - name: Real orchestration E2E (nuclei/checkov against live targets)
        run: |
          pytest tests/e2e_real/ -m "e2e_real and not realism" --maxfail=3 \
            --junitxml=test-results/e2e-real.xml -v
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-real-test-results
          path: test-results/
          if-no-files-found: ignore

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile check
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compileall
        run: python -m compileall -q src tests
      # Real docker-compose smoke (Juice Shop/crAPI/httpbin) runs in an
      # environment with Docker; gated here so CI stays green where Docker is
      # unavailable.
      - name: Smoke marker
        run: echo "compose smoke deferred to Docker-enabled environment (M5 E2E)"

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so gitleaks can scan all commits
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Bandit (Python SAST, gate medium+)
        run: bandit -r src/secopent -ll
      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          # Required by gitleaks-action (free for public repos; configure the
          # secret for private repos). Config: .gitleaks.toml.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      # T13: runtime self-pentest - nuclei scans our own API; the gate is zero
      # critical/high findings. The nuclei container reaches the host-side
      # uvicorn via host.docker.internal:host-gateway (added by the executor).
      - name: Pull nuclei (runtime self-pentest)
        run: docker pull projectdiscovery/nuclei:latest
      - name: Runtime self-pentest (0 critical/high)
        env:
          SECOPTENT_SELF_PENTEST: "1"
        run: pytest -m integration tests/security/test_self_pentest.py -v

  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install (Python)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pip-audit (Python dependency CVE scan)
        run: pip-audit
      - name: npm audit (frontend dependency CVE scan, block on critical)
        working-directory: src/secopent/interfaces/web
        run: |
          npm ci --legacy-peer-deps
          npm audit --audit-level=critical
