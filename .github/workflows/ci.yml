name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Encoding hygiene (no BOM / stray control chars)
        run: |
          ! grep -rlP '\xEF\xBB\xBF' src tests || (echo "BOM found" && exit 1)

  type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: mypy (strict for domain/application)
        run: mypy src/secopent/domain src/secopent/application

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test (coverage gate 70%)
        run: pytest --cov=src --cov-fail-under=70 -q

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile check
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compileall
        run: python -m compileall -q src tests
      # Real docker-compose smoke (Juice Shop/crAPI/httpbin) runs in an
      # environment with Docker; gated here so CI stays green where Docker is
      # unavailable.
      - name: Smoke marker
        run: echo "compose smoke deferred to Docker-enabled environment (M5 E2E)"

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so gitleaks can scan all commits
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Bandit (Python SAST, gate medium+)
        run: bandit -r src/secopent -ll
      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          # Required by gitleaks-action (free for public repos; configure the
          # secret for private repos). Config: .gitleaks.toml.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install (Python)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pip-audit (Python dependency CVE scan)
        run: pip-audit
      - name: npm audit (frontend dependency CVE scan, block on critical)
        working-directory: src/secopent/interfaces/web
        run: |
          npm ci
          npm audit --audit-level=critical
